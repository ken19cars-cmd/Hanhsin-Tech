<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="72" viewBox="0 0 520 72" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7EC8E3"/>
      <stop offset="100%" stop-color="#4BA3C7"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#A8D8EA"/>
      <stop offset="100%" stop-color="#5BB4D4"/>
    </linearGradient>
    <pattern id="grid" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M4 0H0V4" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="0.4"/>
    </pattern>
  </defs>
  <!-- isometric cubes stack -->
  <g transform="translate(8,8)">
    <!-- bottom cube -->
    <path d="M28 44 L14 36 L28 28 L42 36 Z" fill="url(#g1)"/>
    <path d="M14 36 L14 48 L28 56 L28 44 Z" fill="#3D8FB0"/>
    <path d="M28 44 L28 56 L42 48 L42 36 Z" fill="#6BB5D2"/>
    <path d="M28 44 L14 36 L28 28 L42 36 Z" fill="url(#grid)" opacity="0.5"/>
    <!-- middle white cube -->
    <path d="M28 30 L14 22 L28 14 L42 22 Z" fill="#F5FBFE"/>
    <path d="M14 22 L14 34 L28 42 L28 30 Z" fill="#D5E8F2"/>
    <path d="M28 30 L28 42 L42 34 L42 22 Z" fill="#E8F4FA"/>
    <path d="M28 30 L14 22 L28 14 L42 22 Z" fill="url(#grid)" opacity="0.35"/>
    <!-- top cube -->
    <path d="M28 16 L14 8 L28 0 L42 8 Z" fill="url(#g2)"/>
    <path d="M14 8 L14 20 L28 28 L28 16 Z" fill="#4BA3C7"/>
    <path d="M28 16 L28 28 L42 20 L42 8 Z" fill="#7EC8E3"/>
    <path d="M28 16 L14 8 L28 0 L42 8 Z" fill="url(#grid)" opacity="0.45"/>
    <!-- circuit lines from middle -->
    <g stroke="#7EC8E3" stroke-width="1.2" fill="none">
      <path d="M42 26 H54"/>
      <circle cx="54" cy="26" r="2" fill="#7EC8E3"/>
      <path d="M48 26 V18 H58"/>
      <circle cx="58" cy="18" r="2" fill="#7EC8E3"/>
      <path d="M48 26 V34 H56"/>
      <circle cx="56" cy="34" r="2" fill="#7EC8E3"/>
    </g>
  </g>
  <text x="92" y="32" fill="#5A6570" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700">翰欣科技實業有限公司</text>
  <text x="92" y="52" fill="#8A95A0" font-family="Sora, Arial, sans-serif" font-size="11" font-weight="500">Hanxin Technology Industrial Co., Ltd.</text>
</svg>